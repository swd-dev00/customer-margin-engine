name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Python
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Lint migration scripts
        run: shellcheck migrations/bin/*.sh

      - name: Run contract and property tests
        run: python -m pytest -m "not integration"

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: customer_margin_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d customer_margin_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    env:
      TARGET_ENVIRONMENT: test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/customer_margin_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Bootstrap and verify schema tooling
        run: |
          bash migrations/bin/migrate.sh
          bash migrations/bin/verify.sh

      - name: Run PostgreSQL integration tests
        run: python -m pytest -m integration
